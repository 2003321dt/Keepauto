name: 清理工作流历史记录

on:
  schedule:
    - cron: '25 15 */2 * *'

  # 支持手动触发
  workflow_dispatch:

# 同一时间只允许一个实例运行
concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    # 单次任务最长运行 15 分钟
    timeout-minutes: 15

    permissions:
      actions: write
      contents: write

    steps:
      # 供后面 time.txt 提交使用
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧹 清理历史工作流运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 1; // 每个 workflow 保留最近 1 次运行记录

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            core.info(
              `开始清理 ${owner}/${repo} 的工作流历史记录，` +
              `每个 workflow 保留最近 ${KEEP} 次运行记录，` +
              `当前 Run ID ${currentRunId} 不会被删除`
            );

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 }
            );

            core.info(`共发现 ${workflows.length} 个 workflow`);

            let totalDeleted = 0;

            for (const wf of workflows) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id: wf.id, per_page: 100 }
              );

              if (runs.length <= KEEP) {
                core.info(`[${wf.name}] 共 ${runs.length} 条记录，无需清理`);
                continue;
              }

              const toDelete = runs
                .slice(KEEP)
                .filter(run => run.id !== currentRunId);

              core.info(`[${wf.name}] 共 ${runs.length} 条记录，计划删除 ${toDelete.length} 条`);

              let deleted = 0;

              for (const run of toDelete) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id
                  });
                  deleted++;
                } catch (err) {
                  core.warning(`[${wf.name}] 删除 Run ${run.id} 失败：${err.message}`);
                }
              }

              core.info(`[${wf.name}] 实际删除 ${deleted}/${toDelete.length} 条记录`);
              totalDeleted += deleted;
            }

            core.info(`清理完成，共删除 ${totalDeleted} 条历史工作流记录`);

      # 更新时间到time.txt,避免6个月未更新导致工作流暂停
      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
