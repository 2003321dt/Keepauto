name: ModelScope 每日登录领魔粒

# 仓库结构说明：
#   仓库根目录
#   └── modelscope-daily-credits/     ← 真正的项目目录（package.json / src / 脚本都在这里）
#       ├── src/
#       ├── scripts/
#       └── package.json
# 因此下面所有 run 步骤统一指定 working-directory，
# cache / artifact 的 path 相对「仓库根目录」写。

on:
  # 每天 00:10 UTC = 北京时间 08:10（魔粒每天 00:00 北京时间重置）
  schedule:
    - cron: "10 0 * * *"
  # 支持手动点一下就跑
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "登录成功后等待多少秒再刷新页面"
        required: false
        default: "10"
      headless:
        description: "是否无头运行（true/false）"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: modelscope-daily-credits
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # 项目子目录（改了目录名的话，这里和下面的 cache/artifact 路径一起改）
  PROJECT_DIR: modelscope-daily-credits
  WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '10' }}
  HEADLESS: ${{ github.event.inputs.headless || 'true' }}
  LOGIN_TIMEOUT_SECONDS: "90"

defaults:
  run:
    working-directory: modelscope-daily-credits

jobs:
  claim:
    name: 登录并查询魔粒余额
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 校验项目目录
        run: |
          echo "当前目录：$(pwd)"
          ls -la
          test -f package.json || { echo "::error::找不到 package.json，请检查 PROJECT_DIR 是否正确"; exit 1; }

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # setup_proxy.sh 会把 IS_PROXY / PROXY_SERVER 写进 $GITHUB_ENV，
      # 但那只是「记录」，Chromium 不会自己去读，所以这里再产出一个 PROXY_HTTP 交给启动脚本用。
      - name: 🌐 设置 sing-box 代理
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -u
          if [ -z "${NODE_LINK:-}" ]; then
            echo "未配置 NODE_LINK，跳过代理（直连模式）"
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "安装并启动 sing-box ……"
          bash <(curl -fsSL https://main.ssss.nyc.mn/setup_proxy.sh)

          # 同一步里读不到刚写进 GITHUB_ENV 的变量，得自己读文件
          PROXY_SOCKS=$(grep -E '^PROXY_SERVER=' "$GITHUB_ENV" | tail -1 | cut -d= -f2- || true)
          echo "脚本给出的 socks5 入口：${PROXY_SOCKS:-<没拿到>}"

          if [ -z "$PROXY_SOCKS" ]; then
            echo "::warning::没拿到 PROXY_SERVER，代理可能没起来，本次浏览器直连"
            exit 0
          fi

          # sing-box 配置里除了 socks(1080) 还有一个 http 入站(1081)，Chromium 用 http 代理最稳
          if curl -s -x http://127.0.0.1:1081 --max-time 20 https://api.ipify.org -o /tmp/ip_via_proxy.txt \
             && [ -s /tmp/ip_via_proxy.txt ]; then
            echo "PROXY_HTTP=http://127.0.0.1:1081" >> "$GITHUB_ENV"
            echo "✅ 代理可用，经代理的出口 IP：$(cat /tmp/ip_via_proxy.txt)"
          else
            echo "::warning::sing-box 起来了但 HTTP 入站(1081)不通，本次浏览器直连"
          fi

      - name: 恢复上次的登录态缓存
        uses: actions/cache/restore@v4
        with:
          path: modelscope-daily-credits/session
          key: modelscope-session-${{ github.run_id }}
          restore-keys: |
            modelscope-session-

      - name: 登录 → 等 10 秒 → 刷新 → 查积分
        env:
          MODELSCOPE_USERNAME: ${{ secrets.MODELSCOPE_USERNAME }}
          MODELSCOPE_PASSWORD: ${{ secrets.MODELSCOPE_PASSWORD }}
          MODELSCOPE_COOKIE: ${{ secrets.MODELSCOPE_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node src/index.js

      - name: 保存登录态缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: modelscope-daily-credits/session
          key: modelscope-session-${{ github.run_id }}

      - name: 上传截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelscope-run-${{ github.run_id }}
          path: modelscope-daily-credits/artifacts
          if-no-files-found: ignore
          retention-days: 14
